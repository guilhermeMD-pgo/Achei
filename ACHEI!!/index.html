<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vitrine Shopping</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside class="sidebar">
    <div class="logo">VITRINE<span>.</span></div>
    <p class="side-caption">GUIA DO SHOPPING</p>
    <nav>
      <button class="nav-btn active" data-page="inicio">⌂ <span>Início</span></button>
      <button class="nav-btn" data-page="pesquisa">⌕ <span>Pesquisar</span></button>
      <button class="nav-btn" data-page="promocoes">％ <span>Promoções</span></button>
      <button class="nav-btn" data-page="lojas">▦ <span>Lojas</span></button>
      <button class="nav-btn" data-page="favoritos">♡ <span>Favoritos</span></button>
      <button class="nav-btn" data-page="conta">◎ <span>Minha conta</span></button>
    </nav>
    <div class="sidebar-bottom">Seu shopping em um só lugar.</div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div><span class="dot"></span> GUIA DE COMPRAS DO SHOPPING</div>
      <div class="user-chip" id="userChip">Visitante</div>
    </header>
    <section id="app"></section>
    <footer>VITRINE SHOPPING · PROTÓTIPO ACADÊMICO</footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
